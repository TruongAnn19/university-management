<!-- Topbar: hiển thị cho tất cả roles -->
<header class="topbar">
  <div class="topbar-left">
    <div class="page-breadcrumb">
      <i class="bi bi-check2-circle me-2" style="color: #6366f1; font-size: 1rem;"></i>
      <span class="topbar-title">UniManage</span>
    </div>
  </div>

  <div class="topbar-right">

    <!-- Notification Bell: chỉ sinh viên mới có thông báo -->
    <div class="dropdown noti-dropdown" *ngIf="isStudent">
      <button class="icon-btn" id="notiDropdown" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside"
        aria-expanded="false">
        <i class="bi bi-bell-fill"></i>
        <span *ngIf="unreadCount > 0" class="noti-badge">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
      </button>

      <div class="dropdown-menu dropdown-menu-end noti-panel" aria-labelledby="notiDropdown">
        <!-- Panel Header -->
        <div class="noti-panel-header">
          <div class="noti-panel-title">
            <i class="bi bi-bell-fill"></i>
            Thông báo
            <span *ngIf="unreadCount > 0" class="unread-count">{{ unreadCount }}</span>
          </div>
          <!-- stopPropagation ngăn click bubble lên Bootstrap dropdown handler -->
          <button class="btn-refresh" (click)="fetchNotifications(); $event.stopPropagation()" title="Làm mới">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>

        <!-- Empty State -->
        <div *ngIf="notifications.length === 0" class="noti-empty">
          <div class="noti-empty-icon"><i class="bi bi-bell-slash"></i></div>
          <p>Chưa có thông báo nào</p>
        </div>

        <!-- Notification Items -->
        <div class="noti-list" *ngIf="notifications.length > 0">
          <a *ngFor="let item of notifications" class="noti-item" [class.unread]="!item.isRead"
            (click)="onNotificationClick(item)">
            <div class="noti-dot" *ngIf="!item.isRead"></div>
            <div class="noti-content">
              <div class="noti-item-title">{{ item.title }}</div>
              <p class="noti-item-body">{{ item.message }}</p>
              <div class="noti-item-time">
                <i class="bi bi-clock me-1"></i>
                {{ item.createdAt | date:'dd/MM HH:mm' }}
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>

    <!-- User Info Badge (tất cả roles) -->
    <div class="user-topbar">
      <div class="user-topbar-avatar">{{ userInitial }}</div>
      <div class="user-topbar-info">
        <span class="user-topbar-name">{{ userName }}</span>
        <span class="user-topbar-role">{{ roleLabel }}</span>
      </div>
    </div>

  </div>
</header>
